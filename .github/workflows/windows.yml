# The Windows version (windows/): tests on macOS and Windows, and Windows builds for x64
# and ARM64. Runs only when the Windows app or the Kit it ports changes.
name: Windows

on:
  push:
    paths: ["windows/**", "Sources/InnerVoiceKit/**", ".github/workflows/windows.yml"]
    tags: ["win-v*"]
  pull_request:
    paths: ["windows/**", "Sources/InnerVoiceKit/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test tests/InnerVoice.Core.Tests -c Release
      - name: Test the app (headless)
        run: dotnet run --project tests/InnerVoice.App.Tests -c Release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Fetch llama.cpp
        run: tools/fetch-llama.sh
      - name: Publish
        run: dotnet publish src/InnerVoice.App -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/${{ matrix.rid }}
      - name: Add the Visual C++ runtime next to the app
        # llama.cpp needs it; the Store package gets it from the VCLibs dependency instead.
        run: |
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            if [ -f "/c/Windows/System32/$f" ]; then cp "/c/Windows/System32/$f" artifacts/${{ matrix.rid }}/; fi
          done
      - name: Check llama.cpp loads
        run: dotnet test tests/InnerVoice.Core.Tests -c Release --filter LlamaTests -e INNERVOICE_LLAMA_DIR="$PWD/native/${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: InnerVoice-${{ matrix.rid }}
          path: windows/artifacts/${{ matrix.rid }}

  # The Store bundle (x64 + ARM64), for upload to Partner Center. On win-v* tags or by hand.
  package:
    needs: build
    if: startsWith(github.ref, 'refs/tags/win-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InnerVoice-win-x64
          path: windows/artifacts/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: InnerVoice-win-arm64
          path: windows/artifacts/win-arm64
      - name: Pack
        run: ./packaging/pack.ps1 -X64 artifacts/win-x64 -Arm64 artifacts/win-arm64 -Out artifacts/msix
      - uses: actions/upload-artifact@v4
        with:
          name: InnerVoice-msixbundle
          path: windows/artifacts/msix/*.msixbundle
